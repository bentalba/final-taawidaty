<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-vit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd89b;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#19547b;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="bottle-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-vit)"/>
  
  <!-- Vitamin bottle -->
  <g transform="translate(150, 50)">
    <rect x="0" y="30" width="70" height="100" rx="8" fill="url(#bottle-grad)" opacity="0.9"/>
    <rect x="10" y="20" width="50" height="15" rx="5" fill="#d35400" opacity="0.9"/>
    
    <!-- Label -->
    <rect x="10" y="50" width="50" height="40" rx="4" fill="white" opacity="0.9"/>
    <text x="35" y="65" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22" text-anchor="middle">VIT</text>
    <text x="35" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e67e22" text-anchor="middle">C</text>
    
    <!-- Pills inside bottle (visible through) -->
    <circle cx="25" cy="110" r="5" fill="#fff" opacity="0.6"/>
    <circle cx="45" cy="105" r="5" fill="#fff" opacity="0.6"/>
    <circle cx="35" cy="115" r="5" fill="#fff" opacity="0.6"/>
  </g>
  
  <!-- Pills scattered outside -->
  <g>
    <circle cx="100" cy="180" r="10" fill="#e74c3c" opacity="0.8"/>
    <text x="100" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">A</text>
  </g>
  
  <g>
    <circle cx="260" cy="170" r="10" fill="#3498db" opacity="0.8"/>
    <text x="260" y="175" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">D</text>
  </g>
  
  <g>
    <circle cx="290" cy="200" r="10" fill="#9b59b6" opacity="0.8"/>
    <text x="290" y="205" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">E</text>
  </g>
  
  <g>
    <circle cx="130" cy="210" r="10" fill="#2ecc71" opacity="0.8"/>
    <text x="130" y="215" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">K</text>
  </g>
  
  <!-- X mark (not reimbursed) -->
  <g transform="translate(200, 220)">
    <circle cx="0" cy="0" r="30" fill="#e74c3c" opacity="0.2"/>
    <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="#e74c3c" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Warning text -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e67e22" text-anchor="middle">Non Remboursables</text>
</svg>
