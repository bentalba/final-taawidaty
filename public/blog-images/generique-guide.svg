<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#56ab2f;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#a8e063;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="pill-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#56ab2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8e063;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-gen)"/>
  
  <!-- Pill bottle (Brand) -->
  <g transform="translate(80, 60)">
    <rect x="10" y="30" width="50" height="80" rx="5" fill="#e74c3c" opacity="0.9"/>
    <rect x="15" y="20" width="40" height="15" rx="3" fill="#c0392b" opacity="0.9"/>
    <text x="35" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">€€€</text>
    <text x="35" y="135" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Original</text>
  </g>
  
  <!-- Equals sign -->
  <g transform="translate(175, 100)">
    <rect x="0" y="0" width="30" height="4" rx="2" fill="#56ab2f" opacity="0.8"/>
    <rect x="0" y="15" width="30" height="4" rx="2" fill="#56ab2f" opacity="0.8"/>
  </g>
  
  <!-- Pill bottle (Generic) -->
  <g transform="translate(250, 60)">
    <rect x="10" y="30" width="50" height="80" rx="5" fill="url(#pill-green)" opacity="0.9"/>
    <rect x="15" y="20" width="40" height="15" rx="3" fill="#56ab2f" opacity="0.9"/>
    <text x="35" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">€</text>
    <text x="35" y="135" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Générique</text>
  </g>
  
  <!-- Pills scattered -->
  <circle cx="100" cy="200" r="12" fill="#56ab2f" opacity="0.7"/>
  <circle cx="130" cy="210" r="12" fill="#a8e063" opacity="0.7"/>
  <circle cx="160" cy="205" r="12" fill="#56ab2f" opacity="0.7"/>
  
  <!-- Check mark (savings) -->
  <g transform="translate(280, 200)">
    <circle cx="0" cy="0" r="25" fill="#56ab2f" opacity="0.2"/>
    <path d="M-10,-2 L-4,6 L12,-10" stroke="#56ab2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Savings text -->
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#56ab2f" text-anchor="middle">-60% Prix</text>
</svg>
