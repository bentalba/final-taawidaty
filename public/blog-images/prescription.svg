<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-presc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-presc)"/>
  
  <!-- Prescription paper -->
  <g transform="translate(100, 40)">
    <rect x="0" y="0" width="200" height="220" rx="8" fill="url(#paper-grad)" opacity="0.95" stroke="#4facfe" stroke-width="2"/>
    
    <!-- Header line -->
    <rect x="20" y="20" width="160" height="3" rx="1.5" fill="#4facfe" opacity="0.6"/>
    
    <!-- Rx symbol -->
    <text x="30" y="55" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#4facfe" opacity="0.8">℞</text>
    
    <!-- Prescription lines -->
    <line x1="70" y1="50" x2="180" y2="50" stroke="#333" stroke-width="1.5" opacity="0.7"/>
    <line x1="30" y1="75" x2="170" y2="75" stroke="#333" stroke-width="1" opacity="0.4"/>
    <line x1="30" y1="95" x2="170" y2="95" stroke="#333" stroke-width="1" opacity="0.4"/>
    <line x1="30" y1="115" x2="150" y2="115" stroke="#333" stroke-width="1" opacity="0.4"/>
    
    <!-- Doctor signature area -->
    <rect x="30" y="140" width="140" height="50" rx="4" fill="#e3f2fd" opacity="0.5"/>
    <text x="100" y="160" font-family="cursive" font-size="16" fill="#4facfe" text-anchor="middle" opacity="0.6">Signature</text>
    <line x1="40" y1="175" x2="160" y2="175" stroke="#4facfe" stroke-width="1" opacity="0.5"/>
    
    <!-- Date -->
    <text x="30" y="210" font-family="Arial, sans-serif" font-size="10" fill="#666" opacity="0.7">Date: __/__/____</text>
  </g>
  
  <!-- Stethoscope -->
  <g transform="translate(320, 100)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#4facfe" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.7"/>
    <path d="M0,-15 Q-30,-40 -40,-80" stroke="#4facfe" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M0,-15 Q30,-40 40,-80" stroke="#4facfe" stroke-width="3" fill="none" opacity="0.7"/>
    <circle cx="-40" cy="-80" r="5" fill="#4facfe" opacity="0.7"/>
    <circle cx="40" cy="-80" r="5" fill="#4facfe" opacity="0.7"/>
  </g>
  
  <!-- Checkmark (validation) -->
  <g transform="translate(350, 230)">
    <circle cx="0" cy="0" r="20" fill="#2ecc71" opacity="0.3"/>
    <path d="M-8,-2 L-3,5 L10,-8" stroke="#2ecc71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Pills decoration -->
  <circle cx="60" cy="250" r="8" fill="#e74c3c" opacity="0.5"/>
  <circle cx="80" cy="260" r="6" fill="#3498db" opacity="0.5"/>
</svg>
