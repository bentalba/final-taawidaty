<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-calc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="money-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-calc)"/>
  
  <!-- Calculator -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="90" height="120" rx="8" fill="#34495e" opacity="0.9"/>
    <rect x="10" y="10" width="70" height="25" rx="4" fill="#2c3e50" opacity="0.9"/>
    <text x="45" y="28" font-family="monospace" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">80%</text>
    
    <!-- Calculator buttons -->
    <g fill="#95a5a6" opacity="0.8">
      <rect x="10" y="45" width="18" height="15" rx="2"/>
      <rect x="32" y="45" width="18" height="15" rx="2"/>
      <rect x="54" y="45" width="18" height="15" rx="2"/>
      
      <rect x="10" y="65" width="18" height="15" rx="2"/>
      <rect x="32" y="65" width="18" height="15" rx="2"/>
      <rect x="54" y="65" width="18" height="15" rx="2"/>
      
      <rect x="10" y="85" width="18" height="15" rx="2"/>
      <rect x="32" y="85" width="18" height="15" rx="2"/>
      <rect x="54" y="85" width="18" height="15" rx="2"/>
    </g>
    
    <!-- Equals button -->
    <rect x="10" y="105" width="62" height="10" rx="2" fill="#27ae60" opacity="0.9"/>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(200, 110)">
    <path d="M0,0 L30,0 L30,-10 L50,10 L30,30 L30,20 L0,20 Z" fill="url(#money-grad)" opacity="0.8"/>
  </g>
  
  <!-- Money/Coins -->
  <g transform="translate(260, 80)">
    <!-- Coin 1 -->
    <circle cx="0" cy="0" r="30" fill="url(#money-grad)" opacity="0.9"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">DH</text>
    
    <!-- Coin 2 (behind) -->
    <circle cx="25" cy="25" r="25" fill="#f093fb" opacity="0.7"/>
    <text x="25" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">DH</text>
    
    <!-- Coin 3 (small) -->
    <circle cx="50" cy="10" r="18" fill="#f5576c" opacity="0.8"/>
    <text x="50" y="16" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">DH</text>
  </g>
  
  <!-- Dollar signs floating -->
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#f093fb" opacity="0.3">💰</text>
  <text x="320" y="250" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#f5576c" opacity="0.3">💵</text>
  
  <!-- Bottom text -->
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f5576c" text-anchor="middle">Calcul Remboursement</text>
</svg>
