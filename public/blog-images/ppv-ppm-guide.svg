<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-ppv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-ppv)"/>
  
  <!-- Price tag 1 (PPV) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="100" height="80" rx="8" fill="#667eea" opacity="0.9"/>
    <circle cx="85" cy="15" r="8" fill="white" opacity="0.3"/>
    <rect x="85" y="15" width="3" height="20" fill="white" opacity="0.3"/>
    <text x="50" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">PPV</text>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">50 DH</text>
  </g>
  
  <!-- Price tag 2 (PPM) -->
  <g transform="translate(220, 80)">
    <rect x="0" y="0" width="100" height="80" rx="8" fill="#764ba2" opacity="0.9"/>
    <circle cx="85" cy="15" r="8" fill="white" opacity="0.3"/>
    <rect x="85" y="15" width="3" height="20" fill="white" opacity="0.3"/>
    <text x="50" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">PPM</text>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">60 DH</text>
  </g>
  
  <!-- Pills -->
  <ellipse cx="150" cy="210" rx="40" ry="15" fill="url(#pill-grad)" opacity="0.8"/>
  <ellipse cx="250" cy="210" rx="40" ry="15" fill="url(#pill-grad)" opacity="0.8"/>
  
  <!-- Info icon -->
  <circle cx="200" cy="250" r="20" fill="#667eea" opacity="0.2"/>
  <text x="200" y="258" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#667eea" text-anchor="middle">i</text>
</svg>
